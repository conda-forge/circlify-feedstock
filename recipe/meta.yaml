{% set name = "circlify" %}
{% set version = "0.16.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/elmotec/circlify/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 28626db52c351e505a18d8270d69cdb10576b4c235b1d68dac3e3162274b9e3e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - circlify
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://github.com/elmotec/circlify
  summary: Circle packing algorithm for Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - awvwgk
